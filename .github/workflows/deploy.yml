
name: Deploy

on:
  push:
    branches: [dev]

jobs:
  # ── ① 테스트 (러너에 mysql/redis 컨테이너 제공) ──
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qwer1234   # application-test.properties 폴백값과 동일
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pqwer1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run tests (local 태그 제외)
        run: |
          chmod +x gradlew
          ./gradlew test -Pci --no-daemon

  # ── ② 이미지 빌드 → GHCR push ──
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # GHCR push 권한 (GITHUB_TOKEN 자동 인증)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wonzzu/ticketon-spring:latest
      - name: Build & push frontend(nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/wonzzu/ticketon-nginx:latest

  # ── ③ EC2 배포 (SSH → pull & 재기동) ──
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ticketing
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
