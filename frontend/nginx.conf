# =========================================================
#  Nginx — 정적 서빙(Vue) + /api 리버스 프록시(Spring) + HTTPS 종단
#  인증서: 호스트의 /etc/letsencrypt 를 볼륨으로 마운트 (compose 참고)
# =========================================================

# --- HTTP(80): HTTPS로 리다이렉트 ---
server {
    listen 80;
    server_name ticketon.kro.kr;
    return 301 https://$host$request_uri;
}

# --- HTTPS(443): 실제 서비스 ---
server {
    listen 443 ssl;
    server_name ticketon.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/ticketon.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketon.kro.kr/privkey.pem;

    # 업로드/요청 바디 여유
    client_max_body_size 10M;

    # --- 프론트 정적 파일 (SPA) ---
    root /usr/share/nginx/html;
    index index.html;

    # 빌드 산출물은 파일명에 해시가 붙어(예: index-b4oulbfm.js) 내용이 바뀌면 이름도 바뀐다.
    # 그래서 영구 캐시해도 안전하고, 오히려 캐시해야 재방문이 빠르다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;                # 없는 asset은 404로. index.html을 주면 MIME 에러가 난다
    }

    # index.html은 매번 서버에 물어보고 쓴다(no-cache = 캐시하되 항상 재검증).
    # 이게 없으면 배포 후에도 브라우저가 옛 index.html을 들고 있어,
    # 이미 사라진 옛 해시의 chunk를 요청하다 화면이 통째로 깨진다.
    # no-store는 쓰지 않는다 — 뒤로가기 캐시(bfcache)까지 꺼져서 뒤로 갈 때마다 앱이 새로 뜬다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;   # 새로고침 404 방지 (Vue Router history 모드)
    }

    # --- 백엔드 프록시 ---
    # 프론트는 /api/auth/login 으로 요청 → 여기서 /api 벗기고 http://spring:8080/auth/login 으로 전달
    # (백엔드 엔드포인트에 /api prefix가 없기 때문. proxy_pass 끝 슬래시가 prefix를 제거)
    location /api/ {
        proxy_pass http://spring:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for(덧붙이기)가 아니라 $remote_addr(덮어쓰기)를 쓴다.
        # 덧붙이기면 클라이언트가 보낸 위조값이 맨 앞에 남는데, RateLimitAspect가 맨 앞을 읽어 IP 제한이 뚫린다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API 문서 (Swagger UI) ---
    # /api 와 달리 prefix를 벗기지 않는다. springdoc이 /swagger-ui, /v3/api-docs 경로 그대로 서빙하기 때문
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
