# =========================================================
#  Nginx — 정적 서빙(Vue) + /api 리버스 프록시(Spring)
#  HTTPS(443)는 [4]단계 Let's Encrypt에서 추가.
#  지금은 HTTP(80)만 — 로컬/초기 배포 검증용.
# =========================================================
server {
    listen 80;
    server_name _;

    # 업로드/요청 바디 여유
    client_max_body_size 10M;

    # --- 프론트 정적 파일 (SPA) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # 새로고침 404 방지 (Vue Router history 모드)
    }

    # --- 백엔드 프록시 ---
    # 프론트는 /api/auth/login 으로 요청 → 여기서 /api 벗기고 http://spring:8080/auth/login 으로 전달
    # (백엔드 엔드포인트에 /api prefix가 없기 때문. proxy_pass 끝 슬래시가 prefix를 제거)
    location /api/ {
        proxy_pass http://spring:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # RateLimit이 IP로 이걸 읽음
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
