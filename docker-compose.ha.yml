
name: ticketon-ha

# Sentinel 이 IP 로 감시하므로 Redis 계층에는 고정 IP 를 준다.
networks:
  ha-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  redis-master:
    image: redis:7-alpine
    container_name: ha-redis-master
    restart: unless-stopped
    # 대기열·선점 원본이 같은 Redis 에 있어 LRU 로 조용히 지워지면 안 된다.
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction
    networks:
      ha-net:
        ipv4_address: 172.30.0.10

  redis-replica1: &replica
    image: redis:7-alpine
    container_name: ha-redis-replica1
    restart: unless-stopped
    command: >
      redis-server --replicaof 172.30.0.10 6379
                   --maxmemory 100mb --maxmemory-policy noeviction
    networks:
      ha-net:
        ipv4_address: 172.30.0.11
    depends_on:
      - redis-master

  # 복제본 2대 — 승격 후에도 복제본이 남아야 Redisson 의 락 동기화 검증이 성립한다
  redis-replica2:
    <<: *replica
    container_name: ha-redis-replica2
    networks:
      ha-net:
        ipv4_address: 172.30.0.12

  # Sentinel 은 실행 중 자기 설정 파일에 상태를 덮어쓴다.
  # 원본을 :ro 로 두고 /tmp 에 복사해서 띄워야 3대가 서로 안 깨진다.
  sentinel1: &sentinel
    image: redis:7-alpine
    container_name: ha-sentinel1
    restart: unless-stopped
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./ha/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      ha-net:
        ipv4_address: 172.30.0.21
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2

  sentinel2:
    <<: *sentinel
    container_name: ha-sentinel2
    networks:
      ha-net:
        ipv4_address: 172.30.0.22

  sentinel3:
    <<: *sentinel
    container_name: ha-sentinel3
    networks:
      ha-net:
        ipv4_address: 172.30.0.23

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ticketon
      RABBITMQ_DEFAULT_PASS: ticketon-local-password
    networks:
      - ha-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  x-kafka-common: &kafka
    image: apache/kafka:3.9.0
    container_name: ha-kafka1
    restart: unless-stopped
    environment: &kafka-env
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: ticketon-kafka-cluster-01
    networks:
      - ha-net
    healthcheck: &kafka-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  kafka2:
    <<: *kafka
    container_name: ha-kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:9095
    ports:
      - "9095:9094"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    container_name: ha-kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:9096
    ports:
      - "9096:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # kafka1은 anchor 공통값에 노드별 식별자와 광고 주소만 추가한다.
  kafka1:
    <<: *kafka
    container_name: ha-kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:9094
    ports:
      - "9094:9094"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  spring1:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment: &spring-env
      SPRING_PROFILES_ACTIVE: ha
      # LocalDateTime 응답과 DB 시간대를 한국 표준시로 통일한다.
      JAVA_OPTS: "-Xmx256m -Duser.timezone=Asia/Seoul"
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      JWT_SECRET: dev-only-secret-key-must-be-at-least-32-bytes-long-12345
      RABBITMQ_USERNAME: ticketon
      RABBITMQ_PASSWORD: ticketon-local-password
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      OUTBOX_RELAY_WORKER_ID: spring1
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    networks: &app-net
      - ha-net
    ports:
      - "8081:8080"
    depends_on: &spring-depends
      rabbitmq:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    healthcheck: &healthcheck
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  spring2:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment:
      <<: *spring-env
      OUTBOX_RELAY_WORKER_ID: spring2
    extra_hosts: *host-gateway
    networks: *app-net
    ports:
      - "8082:8080"
    depends_on: *spring-depends
    healthcheck: *healthcheck

  spring3:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment:
      <<: *spring-env
      OUTBOX_RELAY_WORKER_ID: spring3
    extra_hosts: *host-gateway
    networks: *app-net
    ports:
      - "8083:8080"
    depends_on: *spring-depends
    healthcheck: *healthcheck

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: *app-net
    ports:
      - "8080:80"
    volumes:
      - ./ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spring1:
        condition: service_healthy
      spring2:
        condition: service_healthy
      spring3:
        condition: service_healthy

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
