
name: ticketon-ha

services:
  spring1:
    build: .
    image: ticketon-ha:local
    environment: &spring-env
      SPRING_PROFILES_ACTIVE: ha
      JAVA_OPTS: "-Xmx256m"
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      JWT_SECRET: dev-only-secret-key-must-be-at-least-32-bytes-long-12345
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    healthcheck: &healthcheck
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  spring2:
    build: .
    image: ticketon-ha:local
    environment: *spring-env
    extra_hosts: *host-gateway
    ports:
      - "8082:8080"
    healthcheck: *healthcheck

  spring3:
    build: .
    image: ticketon-ha:local
    environment: *spring-env
    extra_hosts: *host-gateway
    ports:
      - "8083:8080"
    healthcheck: *healthcheck

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spring1:
        condition: service_healthy
      spring2:
        condition: service_healthy
      spring3:
        condition: service_healthy
