# === 성능 측정 전용 프로파일 (k6 부하 시 사용) ===
# 목적: SQL 로깅/프록시 오버헤드를 제거해 "순수 응답시간"을 측정한다.
# 실행: --spring.profiles.active=perf  (이러면 local의 DataSeedRunner도 안 돌아 재시드 방지)

# SQL 콘솔 출력 끔 (매 쿼리 출력 = 큰 오버헤드)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# p6spy 데코레이터 자체 끔 (DataSource 프록시 오버헤드까지 제거)
decorator.datasource.enabled=false

# 측정 노이즈 줄이기
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=WARN
