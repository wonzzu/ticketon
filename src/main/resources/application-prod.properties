

# === DataSource ===
spring.datasource.url=jdbc:mysql://mysql:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# === Redis ===
spring.data.redis.host=redis
spring.data.redis.port=6379

# === JWT (폴백 없음 — 필수 주입) ===
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000

# === Batch ===
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# === p6spy 끔 (implementation 스코프라 prod에도 포함됨 → DataSource 프록시 오버헤드 제거) ===
decorator.datasource.enabled=false

# === actuator — prod는 health만 노출 ===
management.endpoints.web.exposure.include=health

# === CORS 허용 오리진 (SecurityConfig가 @Value로 읽음) ===
# Nginx가 프론트/백을 같은 도메인으로 합치면 same-origin이라 사실상 미발동.
# 프론트를 별도 도메인에 분리할 때 대비해 명시.
app.cors.allowed-origins=https://ticketon.kro.kr

# === settlement 배치 (프로퍼티화된 튜닝값) ===
settlement.chunk-size=1000
settlement.fetch-size=1000
