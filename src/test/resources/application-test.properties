# === 테스트 전용 공통 설정 ===
# 모든 테스트가 @ActiveProfiles("test")로 이 설정을 공유한다.
# - 실 시드 DB(ticketing)와 분리 → ticketing_test 사용 (createDatabaseIfNotExist로 자동 생성)
# - test 프로파일이라 DataSeedRunner(@Profile("local"))는 자동 비활성화 (시드 적재 안 함)

spring.datasource.url=jdbc:mysql://localhost:3306/ticketing_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:qwer1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Redis (테스트도 로컬 Redis 사용)
spring.data.redis.host=localhost
spring.data.redis.port=6379
outbox.relay.enabled=false

# Kafka를 직접 검증하지 않는 테스트에서는 Listener를 실행하지 않는다.
spring.kafka.listener.auto-startup=false
app.kafka.topic.payment-events=payment-events
app.kafka.topic.queue-events=queue-events
app.kafka.topic.payment-events-partitions=6
app.kafka.topic.replication-factor=1

# Rabbit Listener는 실제 소비 동작을 검증하는 통합 테스트에서만 명시적으로 활성화한다.
# 여러 @SpringBootTest Context가 같은 Queue를 동시에 소비하는 테스트 간 간섭을 방지한다.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=4000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# 로깅 최소화
logging.level.org.hibernate.SQL=OFF

# 성능 테스트: 실행 쿼리 수 측정용 (Hibernate Statistics)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# p6spy(datasource-decorator) SQL 로그 끔 — 쿼리 수는 Hibernate Statistics로 세므로 콘솔 로그는 불필요
decorator.datasource.enabled=false

# === Spring Batch (정산 배치 테스트용) ===
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
