spring.application.name=ticketing

# === 테스트는 MySQL 대신 H2 인메모리 (외부 DB 의존 제거) ===
# 선점 테스트는 Redis만 쓰지만, @SpringBootTest가 JPA 컨텍스트도 띄우므로 H2로 대체.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# === JPA (H2) — 엔티티로부터 스키마 자동 생성 후 종료 시 삭제 ===
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# === Redis — 진짜 도커 Redis 사용 (동시성은 목으로 검증 불가) ===
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === JWT (테스트용 더미 — 32바이트 이상) ===
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes-long-1234567890
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000
